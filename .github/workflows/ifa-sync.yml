name: IFA sync

on:
  schedule:
    # בוקר — GitHub לרוב מאחר בכמה שעות
    - cron: "0 4 * * *"
    # גיבוי אחה״צ אם הבוקר פספס; מדלגים אם כבר נמשך היום
    - cron: "0 14 * * *"
    # קולט לחיצת רענון באפליקציה (מדלג אם אין בקשה)
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ifa-sync
  cancel-in-progress: false

env:
  IFA_CRON_URL: https://oranit-stats.vercel.app/api/ifa/cron
  GAMES_URL: https://www.football.org.il/team-details/team-games/?team_id=2735&season_id=28
  TEAM_URL: https://www.football.org.il/team-details/?team_id=2735&season_id=28

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already synced today
        id: gate
        if: github.event_name != 'workflow_dispatch'
        env:
          IFA_CRON_SECRET: ${{ secrets.IFA_CRON_SECRET }}
        run: |
          if [ -z "$IFA_CRON_SECRET" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o peek.json -w "%{http_code}" "$IFA_CRON_URL?peek=1" \
            -H "Authorization: Bearer $IFA_CRON_SECRET")
          echo "peek HTTP $code"
          head -c 300 peek.json; echo
          if [ "$code" != "200" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e 'const d=require("./peek.json"); const skip = Boolean(d.alreadySyncedToday) && !d.refreshPending; process.exit(skip ? 0 : 1)'; then
            echo "Already synced today and no refresh pending. Skipping scrape."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape football.org.il via ZenRows
        id: scrape
        if: steps.gate.outputs.skip != 'true'
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          if [ -z "$ZENROWS_API_KEY" ]; then
            echo "Error: ZENROWS_API_KEY secret is missing in GitHub Actions."
            exit 1
          fi

          fetch_ifa() {
            local dest="$1"
            local target="$2"
            curl -sS --max-time 90 -G "https://api.zenrows.com/v1/" \
              --data-urlencode "apikey=${ZENROWS_API_KEY}" \
              --data-urlencode "url=${target}" \
              --data-urlencode "js_render=true" \
              --data-urlencode "premium_proxy=true" \
              --data-urlencode "proxy_country=il" \
              --data-urlencode "wait=5000" \
              -o "$dest" \
              -w "%{http_code}"
          }

          echo "Fetching games HTML via ZenRows..."
          games_code=$(fetch_ifa games.html "$GAMES_URL")
          echo "Fetching team HTML via ZenRows..."
          team_code=$(fetch_ifa team.html "$TEAM_URL")
          echo "ZenRows HTTP games=${games_code} team=${team_code}"
          echo "games bytes=$(wc -c < games.html) team bytes=$(wc -c < team.html)"

          if node <<'NODE'
            const fs = require("fs");
            const g = fs.readFileSync("games.html", "utf8");
            const t = fs.readFileSync("team.html", "utf8");
            const gamesOk = g.includes("רשימת המשחקים") || (g.includes("table_row link_url") && g.includes("game_id="));
            const teamOk = t.includes('sr-only">מקום') || (t.includes("table_row") && t.includes("team_id="));
            if (!gamesOk || !teamOk) {
              console.log("games starts:", g.slice(0, 500));
              console.log("team starts:", t.slice(0, 500));
              process.exit(1);
            }
            console.log("Scrape successful!");
          NODE
          then
            echo "scraped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Error: ZenRows failed to bypass Cloudflare or returned bad HTML."
            echo "scraped=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push HTML to Vercel API
        if: steps.gate.outputs.skip != 'true' && steps.scrape.outputs.scraped == 'true'
        env:
          IFA_CRON_SECRET: ${{ secrets.IFA_CRON_SECRET }}
        run: |
          if [ -z "$IFA_CRON_SECRET" ]; then
            echo "Error: IFA_CRON_SECRET secret is missing in GitHub Actions."
            exit 1
          fi

          node -e "const fs=require('fs'); fs.writeFileSync('payload.json', JSON.stringify({ gamesHtml: fs.readFileSync('games.html','utf8'), teamHtml: fs.readFileSync('team.html','utf8') }))"

          code=$(curl -sS -o body.json -w "%{http_code}" -X POST "$IFA_CRON_URL" \
            -H "Authorization: Bearer $IFA_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "HTTP Response: $code"
          head -c 500 body.json; echo

          if [ "$code" != "200" ]; then
            echo "Error: Failed to push to Vercel."
            exit 1
          fi
