name: IFA sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  IFA_CRON_URL: https://oranit-stats.vercel.app/api/ifa/cron
  # הכתובות המקודדות של עמודי ההתאחדות כדי ש-ZenRows יוכל לעבד אותן
  ENC_GAMES: "https%3A%2F%2Fwww.football.org.il%2Fteam-details%2Fteam-games%2F%3Fteam_id%3D2735%26season_id%3D28"
  ENC_TEAM: "https%3A%2F%2Fwww.football.org.il%2Fteam-details%2F%3Fteam_id%3D2735%26season_id%3D28"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scrape football.org.il via ZenRows
        id: scrape
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          if [ -z "$ZENROWS_API_KEY" ]; then
            echo "Error: ZENROWS_API_KEY secret is missing in GitHub Actions."
            exit 1
          fi

          echo "Fetching games HTML via ZenRows..."
          curl -sSL --max-time 60 "https://api.zenrows.com/v1/?apikey=${ZENROWS_API_KEY}&url=${ENC_GAMES}&antibot=true" -o games.html

          echo "Fetching team HTML via ZenRows..."
          curl -sSL --max-time 60 "https://api.zenrows.com/v1/?apikey=${ZENROWS_API_KEY}&url=${ENC_TEAM}&antibot=true" -o team.html

          # ווידוא בסיסי שהקוד שחזר הוא אכן עמודי ההתאחדות ולא שגיאת חסימה
          if grep -q "רשימת המשחקים" games.html && grep -q "מקום" team.html; then
            echo "Scrape successful!"
            echo "scraped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Error: ZenRows failed to bypass Cloudflare or returned bad HTML."
            echo "scraped=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push HTML to Vercel API
        if: steps.scrape.outputs.scraped == 'true'
        env:
          IFA_CRON_SECRET: ${{ secrets.IFA_CRON_SECRET }}
        run: |
          if [ -z "$IFA_CRON_SECRET" ]; then
            echo "Error: IFA_CRON_SECRET secret is missing in GitHub Actions."
            exit 1
          fi
          
          # אריזת קבצי ה-HTML ל-JSON ושליחה ל-Vercel
          node -e "const fs=require('fs'); fs.writeFileSync('payload.json', JSON.stringify({ gamesHtml: fs.readFileSync('games.html','utf8'), teamHtml: fs.readFileSync('team.html','utf8') }))"
          
          code=$(curl -sS -o body.json -w "%{http_code}" -X POST "$IFA_CRON_URL" \
            -H "Authorization: Bearer $IFA_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)
            
          echo "HTTP Response: $code"
          head -c 500 body.json; echo
          
          if [ "$code" != "200" ]; then
            echo "Error: Failed to push to Vercel."
            exit 1
          fi
